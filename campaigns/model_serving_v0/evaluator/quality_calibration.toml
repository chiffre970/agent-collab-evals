schema_version = "model-serving-quality-profile/v0alpha1"
phase = "qwen_quality_calibration"
target_model = "Qwen/Qwen3-4B"
target_revision = "1cfa9a7208912126459214e8b04321603b3df60c"
workload_schema = "model-serving-quality-workload/v0alpha1"
repetitions = 3
pairing = "same_case_and_seed_reference_candidate"
authoritative_evidence = "served_generation"
teacher_forced_role = "diagnostic_only"

[materialization]
cases_per_family = 16
seed_bytes = 32
seed_visibility = "evaluator_private"
source_policy = "content_digest_verified"

[decoding.non_thinking]
enable_thinking = false
temperature_milli = 700
top_p_milli = 800
top_k = 20
min_p_milli = 0
max_tokens = 512

[decoding.thinking]
enable_thinking = true
temperature_milli = 600
top_p_milli = 950
top_k = 20
min_p_milli = 0
max_tokens = 2048

[[families]]
id = "mmlu"
mode = "non_thinking"
scorer = "choice"

[[families]]
id = "structured_transform"
mode = "non_thinking"
scorer = "exact"

[[families]]
id = "gsm8k"
mode = "thinking"
scorer = "numeric"

[[families]]
id = "bbh_reasoning"
mode = "thinking"
scorer = "choice"

[decision]
rule = "paired_family_and_aggregate_noninferiority"
margin_status = "unset_until_reference_and_clean-control_calibration"
uncertainty = "paired_case_bootstrap_to_be_frozen"
failure_policy = "any_missing_or_malformed_response_fails_its_case"
