[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-collab-evals"
version = "0.1.0"
description = "Modular infrastructure for agent collaboration experiments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
calibration = ["tokenizers==0.22.2", "Jinja2==3.1.6"]

[project.scripts]
collab-evals = "agent_collab_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
