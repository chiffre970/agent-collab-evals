# Local development deployment, not a registered execution profile.
# Start with Lima 2.2.0; the image has no floating fallback.
minimumLimaVersion: 2.2.0
vmType: vz
arch: aarch64
cpus: 4
memory: 8GiB
disk: 40GiB
user:
  uid: 1000
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
mounts: []
mountInotify: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
propagateProxyEnv: false
portForwards:
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
containerd:
  system: false
  user: false
# Adapted from Lima 2.2.0's official rootless Docker template. Package
# installation is bootstrap only: retain and qualify the installed engine
# identity before using it in an execution profile.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eu -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v docker >/dev/null 2>&1; then
        curl -fsSL https://get.docker.com | sh
      fi
      systemctl disable --now docker.service docker.socket containerd.service || true
      systemctl mask docker.service docker.socket containerd.service
      apt-get install -y uidmap dbus-user-session python3-venv
  - mode: user
    script: |
      #!/bin/bash
      set -eu -o pipefail
      systemctl --user start dbus
      dockerd-rootless-setuptool.sh install
      docker context use rootless
probes:
  - script: |
      #!/bin/bash
      set -eu -o pipefail
      docker info | grep -q rootless
      test -f /sys/fs/cgroup/cgroup.controllers
    hint: Inspect /var/log/cloud-init-output.log; do not enable paid execution.
